name: Windows Release

on:
  push:
    tags:
      - "v0.1.1"
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_VERSION: "22.14.0"
  RUST_VERSION: "1.96.0"

jobs:
  release:
    name: Build and publish Windows installers
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.96.0

      - name: Validate release metadata
        shell: pwsh
        run: |
          $expected = '0.1.1'
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          $packageLock = Get-Content -Raw package-lock.json | ConvertFrom-Json -AsHashtable
          $rootLock = $packageLock.packages['']
          $cargoVersion = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"$' | Select-Object -First 1).Matches.Groups[1].Value
          $cargoLockMatch = [regex]::Match((Get-Content -Raw src-tauri/Cargo.lock), '(?ms)\[\[package\]\]\s*name = "grok-switch"\s*version = "([^"]+)"')
          $tauriVersion = (Get-Content -Raw src-tauri/tauri.conf.json | ConvertFrom-Json).version

          $versions = @{
            'package.json' = $packageVersion
            'package-lock.json' = $rootLock.version
            'Cargo.toml' = $cargoVersion
            'Cargo.lock' = $cargoLockMatch.Groups[1].Value
            'tauri.conf.json' = $tauriVersion
          }
          $versions.GetEnumerator() | ForEach-Object { Write-Host "$($_.Key): $($_.Value)" }
          if ($versions.Values | Where-Object { $_ -ne $expected }) {
            throw "All release metadata must be $expected."
          }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$expected") {
            throw "The tag must be v$expected."
          }

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Build locked Tauri bundles
        run: npm run tauri:build -- --ci

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: grok-switch-windows-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2.3.2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
